name: Main

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GITHUB_APP_ID: ${{ secrets.BOT_APP_ID }}
      GITHUB_APP_INSTALLATION_ID: ${{ secrets.BOT_APP_INSTALLATION_ID }}
      GITHUB_APP_PRIVATE_KEY: ${{ secrets.BOT_APP_PRIVATE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_MODEL: claude-haiku-4-5-20251001

    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - run: pnpm run tsc
      - run: pnpm run lint
      - run: pnpm exec prettier --check .
      - run: pnpm run knip
      - run: pnpm run depcheck

      - run: pnpm exec playwright test
        env:
          NODE_V8_COVERAGE: ${{ github.workspace }}/coverage/tmp

      - name: Fix coverage file permissions
        run: sudo chmod -R a+rw tests/coverage/tmp 2>/dev/null || true

      - name: Normalize coverage paths
        run: pnpm run coverage:normalize

      - name: Check coverage thresholds
        run: pnpm run coverage:check

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/html/
          retention-days: 30
